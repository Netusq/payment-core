name: AI Code Review (Gemini)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  gemini-review:
    # Не запускать для форков, где недоступны секреты репозитория
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR Diff
        id: diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD \
            -- . ':!*.lock' ':!*.jar' ':!mvnw*' ':!.mvn/*' ':!.idea/*' \
            > pr_diff.txt

          # Ограничиваем размер диффа (~60 КБ), чтобы не упереться в лимиты и не тратить лишние токены
          head -c 60000 pr_diff.txt > pr_diff_trimmed.txt

      - name: Request Gemini Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
        run: |
          python3 - << 'EOF'
          import json
          import os
          import urllib.request
          import urllib.error

          with open("pr_diff_trimmed.txt", "r", encoding="utf-8", errors="replace") as f:
              diff_content = f.read().strip()

          if not diff_content:
              with open("review.md", "w", encoding="utf-8") as out:
                  out.write("Изменений в исходном коде для ревью не обнаружено.")
              raise SystemExit(0)

          system_prompt = (
              "Ты — Senior Java / Spring Boot разработчик, специализирующийся на финтех- и платёжных системах. "
              "Проведи строгое, но конструктивное ревью следующего git diff из Pull Request.\n"
              "Обрати особое внимание на:\n"
              "1. Критические баги, гонки данных (race conditions), блокировки БД и транзакционность (@Transactional).\n"
              "2. Корректность работы с деньгами (BigDecimal, округление, валюты) и идемпотентность операций.\n"
              "3. Уязвимости безопасности, утечки секретов и чувствительных данных в логи.\n"
              "4. Обработку исключений, таймаутов и краевых случаев.\n"
              "5. Архитектуру, чистоту кода и best practices Spring Boot.\n\n"
              "Отвечай на русском языке. Структурируй ответ по категориям: "
              "🔴 Критично, 🟡 Улучшения, 🟢 Что сделано хорошо. "
              "Указывай конкретные файлы и фрагменты кода, предлагай готовые исправления."
          )

          payload = {
              "system_instruction": {
                  "parts": [{"text": system_prompt}]
              },
              "contents": [
                  {
                      "role": "user",
                      "parts": [{"text": f"Проверь этот diff:\n\n```diff\n{diff_content}\n```"}]
                  }
              ],
              "generationConfig": {
                  "temperature": 0.2
              }
          }

          api_key = os.environ["GEMINI_API_KEY"]
          model = os.environ["GEMINI_MODEL"]
          url = f"https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent?key={api_key}"

          req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST"
          )

          try:
              with urllib.request.urlopen(req, timeout=60) as resp:
                  result = json.loads(resp.read().decode("utf-8"))
                  review_text = result["candidates"][0]["content"]["parts"][0]["text"]
          except urllib.error.HTTPError as e:
              error_body = e.read().decode("utf-8", errors="replace")
              review_text = f"⚠️ Ошибка при обращении к Gemini API ({e.code}):\n```\n{error_body}\n```"
          except Exception as e:
              review_text = f"⚠️ Не удалось выполнить AI-ревью: `{e}`"

          with open("review.md", "w", encoding="utf-8") as out:
              out.write(review_text)
          EOF

      - name: Post Review Comment to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('review.md', 'utf8');
            const marker = '<!-- gemini-ai-review -->';
            const body = `${marker}\n## 🤖 Gemini Code Review\n\n${review}`;

            // Ищем предыдущий комментарий бота, чтобы обновлять его при новых коммитах, а не спамить
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(c => c.body.includes(marker));

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }